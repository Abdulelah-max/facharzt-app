<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6c9b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Facharzt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Facharzt KRK – S3-Leitlinie Quiz</title>
<style>
  :root {
    --bg: #f4efe6;
    --bg-card: #faf6ee;
    --bg-elev: #ede5d4;
    --ink: #2a2622;
    --ink-soft: #5b544a;
    --ink-muted: #8a8378;
    --line: #d8cdb7;
    --accent: #5a6b52;
    --accent-soft: #e5ebdf;
    --correct: #3f6b4e;
    --correct-bg: #e3eedd;
    --wrong: #993b3b;
    --wrong-bg: #f3dede;
    --serif: 'Charter', 'Iowan Old Style', 'Georgia', 'Source Serif Pro', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }

  header { padding: 18px 20px 8px; max-width: 720px; margin: 0 auto; }
  header h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: .2px; margin: 0; }
  header .sub { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }

  main { padding: 8px 16px 120px; max-width: 720px; margin: 0 auto; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  .filter {
    background: var(--bg-card); border: 1px solid var(--line); color: var(--ink-soft);
    padding: 8px 12px; border-radius: 999px; font-size: 13px; font-family: var(--sans);
    appearance: none; -webkit-appearance: none; min-height: 36px;
  }

  .scorebar {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 14px;
  }
  .scorebar .num { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .scorebar .grow { flex: 1; }
  .scorebar button.linkish {
    background: none; border: none; color: var(--accent); font-size: 13px; padding: 4px 0;
    cursor: pointer; font-family: var(--sans);
  }

  .card {
    background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--ink-muted); margin-bottom: 12px; }
  .meta .chip { background: var(--bg-elev); padding: 3px 8px; border-radius: 6px; }
  .meta .chip.nr { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .statement {
    font-family: var(--serif); font-size: 19px; line-height: 1.5; color: var(--ink);
    margin: 4px 0 20px;
  }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answers button {
    min-height: 56px; border-radius: 12px; border: 1.5px solid var(--line);
    background: var(--bg-card); font-family: var(--sans); font-size: 16px; font-weight: 500;
    color: var(--ink); cursor: pointer; transition: all .15s ease; padding: 12px;
  }
  .answers button:active { transform: scale(.98); }
  .answers button.true-btn:hover { border-color: var(--correct); }
  .answers button.false-btn:hover { border-color: var(--wrong); }
  .answers button.picked.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .answers button.picked.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .answers button.reveal-correct { border-color: var(--correct); color: var(--correct); }
  .answers button:disabled { cursor: default; opacity: .85; }

  .explanation {
    margin-top: 18px; padding: 14px 16px; background: var(--bg-elev);
    border-left: 3px solid var(--accent); border-radius: 8px; font-size: 14px;
    line-height: 1.55; color: var(--ink-soft);
  }
  .explanation h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-muted); font-weight: 600; }
  .explanation .quote { font-family: var(--serif); font-style: italic; color: var(--ink); margin: 8px 0; padding-left: 10px; border-left: 2px solid var(--line); }
  .explanation .src { margin-top: 8px; font-size: 12px; color: var(--ink-muted); }

  .nextbar { display: flex; gap: 8px; margin-top: 16px; }
  .nextbar button {
    flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid var(--accent);
    background: var(--accent); color: white; font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: var(--sans);
  }
  .nextbar button.ghost { background: transparent; color: var(--accent); }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--ink-muted);
  }
  .empty h2 { font-family: var(--serif); color: var(--ink); font-weight: 600; }
  .empty code { background: var(--bg-elev); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  .view[hidden] { display: none !important; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .topbar button {
    background: none; border: none; font-family: var(--sans);
    font-size: 14px; color: var(--accent); cursor: pointer; padding: 6px 0;
  }

  .dash-section {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 14px;
  }
  .dash-section h2 {
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .8px; color: var(--ink-muted);
    margin: 0 0 12px;
  }

  .progress-bar {
    height: 14px; background: var(--bg-elev); border-radius: 7px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: var(--accent); transition: width .4s ease;
  }
  .progress-label {
    font-size: 14px; color: var(--ink); margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .progress-label .pct { color: var(--ink-muted); margin-left: 8px; }

  .ll-list { list-style: none; padding: 0; margin: 0; }
  .ll-row {
    display: grid; grid-template-columns: 100px 1fr 86px;
    gap: 10px; align-items: center; padding: 7px 0;
    font-size: 13px; color: var(--ink-soft);
  }
  .ll-name { font-weight: 500; color: var(--ink); }
  .ll-bar { height: 8px; background: var(--bg-elev); border-radius: 4px; overflow: hidden; }
  .ll-bar .fill { height: 100%; background: var(--accent); }
  .ll-row.done .ll-bar .fill { background: var(--correct); }
  .ll-num { font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }

  .today-stats {
    display: flex; gap: 24px; align-items: baseline;
    font-size: 14px; color: var(--ink-soft);
  }
  .today-stats .big {
    font-family: var(--serif); font-size: 26px; font-weight: 600;
    color: var(--ink); margin-right: 4px;
  }
  .streak { color: var(--ink-muted); font-size: 13px; margin-top: 10px; }
  .streak.active { color: var(--accent); font-weight: 500; }

  .dash-actions { display: grid; gap: 10px; margin-top: 16px; }
  .dash-actions button {
    min-height: 52px; border-radius: 12px;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-family: var(--sans); font-size: 15px;
    font-weight: 500; cursor: pointer;
  }
  .dash-actions button.primary { background: var(--accent); color: white; }
  .dash-actions button[disabled] { opacity: .5; cursor: default; }

  @media (max-width: 480px) {
    .statement { font-size: 17px; }
    .card { padding: 16px; border-radius: 14px; }
    .ll-row { grid-template-columns: 88px 1fr 80px; gap: 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>Facharzt</h1>
  <div class="sub">Viszeralchirurgie · Prüfungsvorbereitung</div>
</header>

<main id="app">
  <div id="view-dashboard" class="view">
    <div class="dash-section">
      <h2>Gesamt-Fortschritt</h2>
      <div class="progress-bar"><div class="fill" id="d-total-fill" style="width:0%"></div></div>
      <div class="progress-label"><span id="d-total-text">0 / 0</span><span class="pct" id="d-total-pct">(0 %)</span></div>
    </div>

    <div class="dash-section">
      <h2>Pro Leitlinie</h2>
      <ul class="ll-list" id="d-leitlinien"></ul>
    </div>

    <div class="dash-section">
      <h2>Heute</h2>
      <div class="today-stats">
        <div><span class="big" id="d-today-count">0</span>Fragen</div>
        <div><span class="big" id="d-today-rate">–</span>richtig</div>
      </div>
      <div class="streak" id="d-streak">Streak: 0 Tage</div>
    </div>

    <div class="dash-actions">
      <button class="primary" id="d-resume">Weiter wo ich aufgehört habe</button>
      <button id="d-analytics" disabled>Analytik (folgt im nächsten Update)</button>
    </div>
  </div>

  <div id="view-quiz" class="view" hidden>
    <div class="topbar">
      <button id="q-back">← Übersicht</button>
    </div>
    <div id="filters" class="filters">
      <select id="f-chapter" class="filter"><option value="">Alle Kapitel</option></select>
      <select id="f-topic" class="filter"><option value="">Alle Themen</option></select>
      <select id="f-difficulty" class="filter">
        <option value="">Alle Schwierigkeiten</option>
        <option value="leicht">leicht</option>
        <option value="mittel">mittel</option>
        <option value="schwer">schwer</option>
      </select>
      <select id="f-mode" class="filter">
        <option value="all">Alle Fragen</option>
        <option value="wrong">Nur falsche wiederholen</option>
        <option value="new">Nur neue</option>
      </select>
    </div>
    <div id="scorebar" class="scorebar">
      <span><span class="num" id="s-progress">0/0</span> · richtig <span class="num" id="s-correct">0</span></span>
      <span class="grow"></span>
      <button class="linkish" id="s-reset">Von vorne</button>
    </div>
    <div id="quiz"></div>
  </div>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const STORAGE_KEY = 'facharzt-krk';
const STORAGE_VERSION = 2;

let questions = [];
let meta = null;
let queue = [];
let idx = 0;
let answered = 0;
let correctCount = 0;
let state = loadState();
let currentKey = '';

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (raw && raw.version === STORAGE_VERSION) return raw;
  } catch {}
  return { version: STORAGE_VERSION, progress: {}, answers: {}, sessions: {}, lastFilter: null };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getFilterKey() {
  return [$('#f-chapter').value, $('#f-topic').value, $('#f-difficulty').value, $('#f-mode').value].join('|');
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function showView(name) {
  $('#view-dashboard').hidden = name !== 'dashboard';
  $('#view-quiz').hidden = name !== 'quiz';
  if (name === 'dashboard') renderDashboard();
}

async function init() {
  // load meta + questions in parallel
  const [qRes, mRes] = await Promise.allSettled([
    fetch('data/questions.json', { cache: 'no-store' }),
    fetch('data/meta.json', { cache: 'no-store' }),
  ]);
  try { questions = await qRes.value.json(); } catch { questions = []; }
  try { meta = await mRes.value.json(); } catch { meta = null; }

  if (!questions.length) { renderEmpty(); return; }

  buildFilters();

  if (state.lastFilter) {
    if ($('#f-chapter').querySelector(`option[value="${cssEsc(state.lastFilter.chapter)}"]`)) $('#f-chapter').value = state.lastFilter.chapter;
    if ($('#f-topic').querySelector(`option[value="${cssEsc(state.lastFilter.topic)}"]`)) $('#f-topic').value = state.lastFilter.topic;
    $('#f-difficulty').value = state.lastFilter.difficulty || '';
    $('#f-mode').value = state.lastFilter.mode || 'all';
  }

  // Dashboard navigation
  $('#d-resume').addEventListener('click', () => {
    showView('quiz');
    applyFilters();
  });
  $('#q-back').addEventListener('click', () => {
    showView('dashboard');
  });

  // Quiz filter + reset handlers
  $('#f-chapter').addEventListener('change', applyFilters);
  $('#f-topic').addEventListener('change', applyFilters);
  $('#f-difficulty').addEventListener('change', applyFilters);
  $('#f-mode').addEventListener('change', applyFilters);
  $('#s-reset').addEventListener('click', () => {
    if (confirm('Fortschritt für diese Filter-Auswahl von vorne starten?')) {
      delete state.progress[currentKey];
      saveState();
      applyFilters();
    }
  });

  showView('dashboard');
}

function renderDashboard() {
  if (!meta) {
    // fallback: just show questions count
    const total = questions.length;
    $('#d-total-text').textContent = `${total} / ${total}`;
    $('#d-total-pct').textContent = '(100 %)';
    $('#d-total-fill').style.width = '100%';
    $('#d-leitlinien').innerHTML = '<li class="ll-row"><span class="ll-name">Alle</span><div class="ll-bar"><div class="fill" style="width:100%"></div></div><span class="ll-num">' + total + '</span></li>';
  } else {
    // count questions per leitlinie.id
    const counts = {};
    for (const q of questions) {
      const id = q.leitlinie?.id || 'unknown';
      counts[id] = (counts[id] || 0) + 1;
    }
    const totalCurrent = questions.length;
    const totalPlanned = meta.gesamt_geplant || meta.leitlinien.reduce((s, l) => s + l.geplante_fragen, 0);
    const totalPct = Math.min(100, Math.round(totalCurrent / totalPlanned * 100));
    $('#d-total-text').textContent = `${totalCurrent} / ${totalPlanned}`;
    $('#d-total-pct').textContent = `(${totalPct} %)`;
    $('#d-total-fill').style.width = totalPct + '%';

    // Per Leitlinie
    const rows = meta.leitlinien.map(l => {
      const cur = counts[l.id] || 0;
      const planned = l.geplante_fragen;
      const pct = planned ? Math.min(100, Math.round(cur / planned * 100)) : 0;
      const done = cur >= planned;
      const mark = done ? '✓' : '';
      return `
        <li class="ll-row${done ? ' done' : ''}">
          <span class="ll-name">${esc(l.kurz)}</span>
          <div class="ll-bar"><div class="fill" style="width:${pct}%"></div></div>
          <span class="ll-num">${cur} / ${planned} ${mark}</span>
        </li>`;
    }).join('');
    $('#d-leitlinien').innerHTML = rows;
  }

  // Heute
  const today = state.sessions[todayStr()] || { answered: 0, correct: 0 };
  $('#d-today-count').textContent = today.answered;
  if (today.answered > 0) {
    const rate = Math.round(today.correct / today.answered * 100);
    $('#d-today-rate').textContent = rate + ' %';
  } else {
    $('#d-today-rate').textContent = '–';
  }

  // Streak: count consecutive days backwards with ≥10 questions, including today if ≥10
  const streak = computeStreak();
  const el = $('#d-streak');
  if (streak > 0) {
    el.textContent = `Streak: ${streak} ${streak === 1 ? 'Tag' : 'Tage'}`;
    el.classList.add('active');
  } else {
    el.textContent = 'Streak: 0 Tage (mind. 10 Fragen/Tag)';
    el.classList.remove('active');
  }

  // Resume button label dynamics
  const lastKey = state.lastFilter ?
    [state.lastFilter.chapter, state.lastFilter.topic, state.lastFilter.difficulty, state.lastFilter.mode].join('|') :
    null;
  const lastProg = lastKey ? state.progress[lastKey] : null;
  const btn = $('#d-resume');
  if (lastProg && lastProg.queue && lastProg.queue.length > (lastProg.currentIndex || 0)) {
    const remaining = lastProg.queue.length - (lastProg.currentIndex || 0);
    btn.textContent = `Weiter — noch ${remaining} Frage${remaining === 1 ? '' : 'n'}`;
  } else {
    btn.textContent = 'Quiz starten';
  }
}

function computeStreak() {
  let streak = 0;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  while (true) {
    const key = d.toISOString().slice(0, 10);
    const s = state.sessions[key];
    if (s && s.answered >= 10) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (streak === 0 && key === todayStr()) {
      // Today not yet ≥10 — break, streak stays 0 unless yesterday already counts
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function buildFilters() {
  const chapters = [...new Set(questions.map(q => q.kapitel).filter(Boolean))].sort();
  const topics = [...new Set(questions.map(q => q.thema).filter(Boolean))].sort();
  for (const c of chapters) $('#f-chapter').insertAdjacentHTML('beforeend', `<option value="${esc(c)}">${esc(c)}</option>`);
  for (const t of topics) $('#f-topic').insertAdjacentHTML('beforeend', `<option value="${esc(t)}">${esc(t)}</option>`);
}

function matchesFilter(q, ch, tp, df, md) {
  if (ch && q.kapitel !== ch) return false;
  if (tp && q.thema !== tp) return false;
  if (df && q.schwierigkeit !== df) return false;
  const a = state.answers[q.id];
  if (md === 'wrong') return a && a.lastAnswer !== q.answer;
  if (md === 'new') return !a;
  return true;
}

function applyFilters() {
  currentKey = getFilterKey();
  const ch = $('#f-chapter').value;
  const tp = $('#f-topic').value;
  const df = $('#f-difficulty').value;
  const md = $('#f-mode').value;

  state.lastFilter = { chapter: ch, topic: tp, difficulty: df, mode: md };

  const matching = questions.filter(q => matchesFilter(q, ch, tp, df, md));
  const matchingIds = new Set(matching.map(q => q.id));

  const saved = state.progress[currentKey];
  if (saved && Array.isArray(saved.queue) && saved.queue.length) {
    queue = saved.queue
      .filter(id => matchingIds.has(id))
      .map(id => questions.find(q => q.id === id))
      .filter(Boolean);
    idx = Math.min(saved.currentIndex || 0, queue.length);
  } else {
    queue = matching.slice();
    shuffle(queue);
    state.progress[currentKey] = {
      queue: queue.map(q => q.id),
      currentIndex: 0,
      lastSeen: new Date().toISOString()
    };
    idx = 0;
  }
  saveState();

  // recompute counters from saved answers for current prefix
  answered = idx;
  correctCount = 0;
  for (let i = 0; i < idx && i < queue.length; i++) {
    const a = state.answers[queue[i].id];
    if (a && a.lastAnswer === queue[i].answer) correctCount++;
  }

  updateScore();
  renderCurrent();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function updateScore() {
  $('#s-progress').textContent = `${Math.min(idx, queue.length)}/${queue.length}`;
  $('#s-correct').textContent = correctCount;
}

function renderEmpty() {
  $('#quiz').innerHTML = `
    <div class="empty">
      <h2>Noch keine Fragen</h2>
      <p>Trage Fragen in <code>data/questions.json</code> ein.</p>
    </div>`;
}

function renderCurrent() {
  if (!queue.length) {
    $('#quiz').innerHTML = `<div class="empty"><h2>Keine Fragen im Filter</h2><p>Versuche andere Filter-Einstellungen.</p></div>`;
    return;
  }
  if (idx >= queue.length) {
    const pct = queue.length ? Math.round(correctCount / queue.length * 100) : 0;
    $('#quiz').innerHTML = `
      <div class="empty">
        <h2>Durchlauf abgeschlossen</h2>
        <p>${correctCount} von ${queue.length} richtig (${pct}%).</p>
        <div class="nextbar">
          <button onclick="newRound()">Neue Runde mit denselben Filtern</button>
        </div>
      </div>`;
    return;
  }

  const q = queue[idx];
  $('#quiz').innerHTML = `
    <div class="card" id="card">
      <div class="meta">
        <span class="chip nr">Empf. ${esc(q.empfehlung_nr || '?')}</span>
        ${q.evidenz ? `<span class="chip">${esc(q.evidenz)}</span>` : ''}
        ${q.konsensstaerke ? `<span class="chip">${esc(q.konsensstaerke)}</span>` : ''}
        ${q.kapitel ? `<span class="chip">${esc(q.kapitel)}</span>` : ''}
        ${q.seite_pdf ? `<span class="chip">S. ${esc(q.seite_pdf)}</span>` : ''}
      </div>
      <div class="statement">${esc(q.statement)}</div>
      <div class="answers">
        <button class="true-btn" data-pick="true">Richtig</button>
        <button class="false-btn" data-pick="false">Falsch</button>
      </div>
      <div id="reveal"></div>
    </div>`;

  $('#card').querySelectorAll('[data-pick]').forEach(btn => {
    btn.addEventListener('click', () => handlePick(btn.dataset.pick === 'true'));
  });
}

function newRound() {
  delete state.progress[currentKey];
  saveState();
  applyFilters();
}

function handlePick(picked) {
  const q = queue[idx];
  const isCorrect = picked === q.answer;
  answered++;
  if (isCorrect) correctCount++;

  const a = state.answers[q.id] = state.answers[q.id] || { correct: 0, wrong: 0 };
  if (isCorrect) a.correct++; else a.wrong++;
  a.lastAnswer = picked;
  a.lastAnsweredAt = new Date().toISOString();

  const today = todayStr();
  const s = state.sessions[today] = state.sessions[today] || { answered: 0, correct: 0 };
  s.answered++;
  if (isCorrect) s.correct++;

  state.progress[currentKey].lastSeen = new Date().toISOString();
  saveState();

  const btns = $('#card').querySelectorAll('[data-pick]');
  btns.forEach(b => {
    b.disabled = true;
    const v = b.dataset.pick === 'true';
    if (v === picked) b.classList.add('picked', isCorrect ? 'correct' : 'wrong');
    if (v === q.answer && !isCorrect) b.classList.add('reveal-correct');
  });

  $('#reveal').innerHTML = `
    <div class="explanation">
      <h4>${isCorrect ? 'Richtig' : 'Falsch'} · Empfehlung ${esc(q.empfehlung_nr || '')}</h4>
      <div>${esc(q.explanation || '')}</div>
      ${q.leitlinie_wortlaut ? `<div class="quote">${esc(q.leitlinie_wortlaut)}</div>` : ''}
      <div class="src">${esc(q.leitlinie?.name || '')} ${esc(q.leitlinie?.version || '')}${q.seite_pdf ? ` · S. ${esc(q.seite_pdf)}` : ''}</div>
    </div>
    <div class="nextbar">
      <button id="next-btn">Weiter</button>
    </div>`;

  $('#next-btn').addEventListener('click', () => {
    idx++;
    state.progress[currentKey].currentIndex = idx;
    saveState();
    updateScore();
    renderCurrent();
  });
  updateScore();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function cssEsc(s) {
  return String(s ?? '').replace(/["\\]/g, '\\$&');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

init();
</script>
</body>
</html>
